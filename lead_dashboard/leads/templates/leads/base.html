<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Lead Scoring Dashboard{% endblock %}</title>
    <style>
        :root {
            --hot: #d64545;
            --warm: #d69a2d;
            --cold: #4a7ba6;
            --bg: #f6f5f2;
            --card: #ffffff;
            --ink: #24272b;
            --muted: #6b7280;
            --border: #e5e3de;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            margin: 0;
            padding: 32px 24px;
        }
        .wrap { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 1.4rem; margin-bottom: 4px; }
        .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .stat .num { font-size: 1.6rem; font-weight: 600; }
        .stat .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
        .stat.hot .num { color: var(--hot); }
        .stat.warm .num { color: var(--warm); }
        .stat.cold .num { color: var(--cold); }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
        .badge {
            display: inline-block; padding: 2px 10px; border-radius: 999px;
            font-size: 0.78rem; font-weight: 600; color: white;
        }
        .badge.Hot { background: var(--hot); }
        .badge.Warm { background: var(--warm); }
        .badge.Cold { background: var(--cold); }
        .filters a {
            display: inline-block; margin-right: 8px; padding: 6px 14px;
            border: 1px solid var(--border); border-radius: 999px; text-decoration: none;
            color: var(--ink); font-size: 0.85rem;
        }
        .filters a.active { background: var(--ink); color: white; border-color: var(--ink); }
        .messages { margin-bottom: 16px; }
        .messages li { list-style: none; padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; font-size: 0.9rem; }
        .messages .success { background: #e7f5e9; color: #2a6b3a; }
        .messages .error { background: #fbe7e7; color: #a33; }
        a.upload-link { color: var(--ink); font-size: 0.85rem; }
        .empty { color: var(--muted); font-style: italic; padding: 20px 0; }
        input[type=file] { margin: 10px 0; }
        button {
            background: var(--ink); color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-size: 0.9rem;
        }
        button:hover { opacity: 0.9; }
        .help { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    </style>
</head>
<body>
<div class="wrap">
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
